[env:lolin_s3_mini]
; Exact versions, so every build of a commit is the same binary. Bump
; deliberately, then re-verify on hardware. ArduinoJson must stay on v7.
platform = espressif32@8.0.0
; The hardware is an ESP32-S3 SuperMini, which has no board definition of its
; own. lolin_s3_mini is the same chip, and every pin is set in main.cpp.
board = lolin_s3_mini
framework = arduino

lib_deps =
    adafruit/Adafruit SSD1306@2.5.17
    adafruit/Adafruit GFX Library@1.13.0
    crankyoldgit/IRremoteESP8266@2.9.0
    bblanchon/ArduinoJson@7.4.3

; The board definition sets ARDUINO_USB_MODE=1 (serial). It is removed rather
; than overridden so the build never depends on which -D wins. At 1 the stick
; enumerates as a serial port and the daemon never finds it.
build_unflags =
    -DARDUINO_USB_MODE=1

build_flags =
    ; TinyUSB, needed for a custom HID device.
    -D ARDUINO_USB_MODE=0

; `pio run -t uploadfs` writes data/ (the web UI) to this partition.
board_build.filesystem = littlefs

; One app slot of 2.5 MB, not the default two of 1.25 MB: the firmware has no
; over-the-air updates, and on Arduino core 3.x it fills 97% of a 1.25 MB slot.
; The filesystem keeps the default table's offset and size, so the profiles on a
; stick survive the change. Never move it, or they are lost.
board_build.partitions = partitions.csv

; The default finder (chain) misses the FS library that core 3.x's LittleFS and
; USB libraries include, and the build fails on a missing FS.h.
lib_ldf_mode = deep

[env:lolin_s3_mini]
; Kept on the same platform and libraries as firmware/, so a board that passes
; this test is running the same USB stack as the real firmware.
platform = espressif32@8.0.0
board = lolin_s3_mini
framework = arduino

lib_deps =
    adafruit/Adafruit SSD1306@2.5.17
    adafruit/Adafruit GFX Library@1.13.0

; The board definition sets ARDUINO_USB_MODE=1 (serial); TinyUSB, needed for a
; custom HID device, is mode 0.
build_unflags =
    -DARDUINO_USB_MODE=1

build_flags =
    -D ARDUINO_USB_MODE=0

; See firmware/platformio.ini: the default finder misses the FS library.
lib_ldf_mode = deep

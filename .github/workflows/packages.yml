name: Packages

# Every push: compile the daemon on Linux and Windows.
# A v* tag: also build the .deb and .rpm and publish a public GitHub Release.
# Packages are built in containers that ship sdbus-c++ 2.x.

on:
  push:
    tags: ['v*']
    branches: ['main']
  pull_request:
  workflow_dispatch:

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install hidapi via vcpkg
        run: vcpkg install hidapi:x64-windows

      - name: Configure
        run: >
          cmake -B daemon/build -S daemon -G "Visual Studio 17 2022" -A x64
          -DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        run: cmake --build daemon/build --config Release

  linux-build:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            cmake g++ pkg-config libsdbus-c++-dev libhidapi-dev libudev-dev
      - name: Configure and build
        run: |
          cmake -B daemon/build -S daemon
          cmake --build daemon/build

  deb:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Not the bare runner: Ubuntu 24.04 still ships sdbus-c++ 1.x.
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            cmake g++ pkg-config file \
            libsdbus-c++-dev libhidapi-dev libudev-dev

      - name: Build
        run: |
          cmake -B daemon/build -S daemon -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build daemon/build

      - name: Package
        run: cpack -G DEB --config daemon/build/CPackConfig.cmake -B daemon/build

      - name: Inspect the package
        run: |
          dpkg-deb --info    daemon/build/*.deb
          dpkg-deb --contents daemon/build/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: daemon/build/*.deb

  rpm:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Rawhide, because stable Fedora still ships sdbus-c++ 1.x. The .rpm needs
    # Fedora 44 or newer, so treat it as a preview.
    container: fedora:rawhide
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            cmake gcc-c++ pkgconf-pkg-config rpm-build \
            sdbus-cpp-devel hidapi-devel systemd-devel

      - name: Build
        run: |
          cmake -B daemon/build -S daemon -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build daemon/build

      - name: Package
        run: cpack -G RPM --config daemon/build/CPackConfig.cmake -B daemon/build

      - name: Inspect the package
        run: |
          rpm -qip daemon/build/*.rpm
          rpm -qlp daemon/build/*.rpm

      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: daemon/build/*.rpm

  release:
    needs: [deb, rpm]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.{deb,rpm}
